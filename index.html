<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d1117">
<title>GG Library</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1117;--surface:#161b22;--s2:#21262d;--border:#30363d;--text:#e6edf3;--muted:#7d8590;--green:#3fb950;--gG:rgba(63,185,80,0.4);--red:#f85149;--gR:rgba(248,81,73,0.4);--yellow:#d29922;--gY:rgba(210,153,34,0.35);--accent:#58a6ff;--r:12px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100dvh;padding:10px 14px 28px;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(88,166,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(88,166,255,.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:480px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.logo{display:flex;align-items:center;gap:8px}
.logo-icon{width:32px;height:32px;background:linear-gradient(135deg,#1c2a3a,#1f3a5f);border:1px solid rgba(88,166,255,.3);border-radius:9px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 16px rgba(88,166,255,.15);font-size:16px}
.logo-text{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;background:linear-gradient(135deg,#e6edf3,#58a6ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.logo-sub{font-size:9px;color:var(--muted);font-family:'JetBrains Mono',monospace}
.conn{display:flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:6px 10px}
.conn .dot{width:8px;height:8px;border-radius:50%;background:var(--s2);flex-shrink:0}
.conn .dot.ok{background:var(--green);box-shadow:0 0 8px var(--gG)}
.conn .dot.bad{background:var(--red);box-shadow:0 0 8px var(--gR)}
.conn .dot.chk{background:var(--yellow);animation:py .8s ease-in-out infinite}

.summary{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.s-label{font-size:10px;color:var(--muted);font-family:'JetBrains Mono',monospace;letter-spacing:1px;text-transform:uppercase}
.s-count{font-size:22px;font-weight:700;font-family:'JetBrains Mono',monospace;margin-top:2px}
.s-count .n1{color:var(--green)}.s-count .sep{color:var(--border);margin:0 2px}.s-count .n2{color:var(--muted);font-size:16px}
.last{font-size:10px;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-top:3px}
.rbtn{display:flex;align-items:center;gap:7px;background:linear-gradient(135deg,#1c2a3a,#1f3a5f);border:1px solid rgba(88,166,255,.3);border-radius:8px;padding:9px 14px;color:var(--accent);font-size:13px;font-weight:500;cursor:pointer;transition:all .2s}
.rbtn:active{background:rgba(88,166,255,.15)}
.rbtn svg{width:14px;height:14px}
.rbtn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}

.search{margin-bottom:10px}
.search input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--text);font-size:13px;font-family:'Inter',sans-serif}
.search input::placeholder{color:var(--muted)}
.search input:focus{outline:none;border-color:var(--accent)}

.list{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;display:flex;align-items:center;gap:10px;transition:border-color .3s,box-shadow .3s;animation:fadeUp .4s ease both}
.card.ready{border-color:rgba(63,185,80,.22)}
.card.running{border-color:rgba(88,166,255,.3);box-shadow:0 0 20px rgba(88,166,255,.06)}
.card.error{border-color:rgba(248,81,73,.25);box-shadow:0 0 20px rgba(248,81,73,.06)}
.card.compressed{cursor:pointer}
.card.compressed:active{background:var(--s2)}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.g-ico{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px;background:var(--s2);border:1px solid var(--border)}
.g-ico.ready{background:rgba(63,185,80,.1);border-color:rgba(63,185,80,.2)}
.g-ico.running{background:rgba(88,166,255,.1);border-color:rgba(88,166,255,.25)}
.g-ico.error{background:rgba(248,81,73,.1);border-color:rgba(248,81,73,.2)}

.g-info{flex:1;min-width:0}
.g-name{font-size:14px;font-weight:600;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-meta{font-size:11px;color:var(--muted);margin-top:2px;font-family:'JetBrains Mono',monospace;display:flex;align-items:center;gap:6px}
.g-meta .msg{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.bar{margin-top:6px;height:4px;border-radius:2px;background:var(--s2);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#58a6ff,#79c0ff);border-radius:2px;transition:width .3s ease}

.badge{font-size:9px;font-family:'JetBrains Mono',monospace;letter-spacing:.5px;text-transform:uppercase;padding:3px 7px;border-radius:20px;flex-shrink:0;white-space:nowrap}
.badge.ready{color:var(--green);background:rgba(63,185,80,.1);border:1px solid rgba(63,185,80,.25)}
.badge.compressed{color:var(--muted);background:var(--s2);border:1px solid var(--border)}
.badge.running{color:var(--accent);background:rgba(88,166,255,.1);border:1px solid rgba(88,166,255,.25)}
.badge.error{color:var(--red);background:rgba(248,81,73,.1);border:1px solid rgba(248,81,73,.25)}

.empty,.offline{background:var(--surface);border:1px dashed var(--border);border-radius:var(--r);padding:28px 18px;text-align:center;color:var(--muted);font-size:13px}
.offline{border-color:rgba(248,81,73,.25)}
.offline b{display:block;color:var(--text);font-size:14px;margin-bottom:4px}
.offline .hint{font-size:11px;margin-top:8px;font-family:'JetBrains Mono',monospace;color:var(--muted)}

footer{text-align:center;font-size:10px;color:var(--muted);font-family:'JetBrains Mono',monospace;padding-top:6px}

@keyframes py{0%,100%{opacity:1}50%{opacity:.3}}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--surface);border:1px solid var(--border);color:var(--text);font-size:12px;padding:10px 16px;border-radius:10px;opacity:0;transition:all .25s ease;z-index:200;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{border-color:rgba(248,81,73,.35)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">
      <div class="logo-icon">🎮</div>
      <div>
        <div class="logo-text">GG Library</div>
        <div class="logo-sub" id="hostLabel">—</div>
      </div>
    </div>
    <div class="conn"><span class="dot chk" id="connDot"></span><span id="connText">conectando</span></div>
  </header>

  <div class="summary">
    <div>
      <div class="s-label">Juegos</div>
      <div class="s-count"><span class="n1" id="readyCount">—</span><span class="sep">/</span><span class="n2" id="totalCount">—</span> <span style="font-size:12px;color:var(--muted)">listos</span></div>
      <div class="last" id="lastCheck">Verificando...</div>
    </div>
    <button class="rbtn" id="rbtn" onclick="refresh(true)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <polyline points="23 4 23 10 17 10"/>
        <path d="M20.5 15a9 9 0 1 1-2.5-8.6L23 10"/>
      </svg>
      Verificar
    </button>
  </div>

  <div class="search">
    <input id="q" type="text" placeholder="Buscar juego..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" oninput="render()">
  </div>

  <div class="list" id="list"></div>

  <footer id="footer">gg_server —</footer>
</div>

<div class="toast" id="toast"></div>

<script>
// ── Config fija: misma PC/Tailscale que gg_server.py, sin pedir nada ──────
const SERVER = { host: '100.93.228.17', port: 9898 };
const AUTO_REFRESH_MS = 20000;   // recarga completa de /api/games
const PROGRESS_POLL_MS = 1200;   // polling rapido de juegos "running"
const HTML_VERSION = '1.0';

function base(path) {
  return `http://${SERVER.host}:${SERVER.port}${path}`;
}

let games = [];
let serverVersion = null;
let lastOk = false;
let refreshing = false;

function fmtSize(bytes) {
  if (bytes == null) return '';
  const u = ['B','KB','MB','GB','TB'];
  let i = 0, n = bytes;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return `${n.toFixed(n < 10 && i > 0 ? 1 : 0)} ${u[i]}`;
}

function showToast(msg, isErr) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isErr ? ' err' : '');
  clearTimeout(showToast._h);
  showToast._h = setTimeout(() => { t.className = 'toast'; }, 2600);
}

function setConn(state) {
  // state: 'ok' | 'bad' | 'chk'
  const dot = document.getElementById('connDot');
  const txt = document.getElementById('connText');
  dot.className = 'dot ' + state;
  txt.textContent = state === 'ok' ? 'online' : state === 'bad' ? 'sin conexión' : 'verificando';
}

async function apiGet(path) {
  const ctrl = new AbortController();
  const to = setTimeout(() => ctrl.abort(), 6000);
  try {
    const res = await fetch(base(path), { signal: ctrl.signal, cache: 'no-store', mode: 'cors' });
    clearTimeout(to);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return await res.json();
  } catch (e) {
    clearTimeout(to);
    throw e;
  }
}

async function refresh(manual) {
  if (refreshing) return;
  refreshing = true;
  const rbtn = document.getElementById('rbtn');
  if (manual) rbtn.classList.add('spin');
  setConn('chk');

  try {
    const [status, gamesRes] = await Promise.all([
      apiGet('/api/status'),
      apiGet('/api/games'),
    ]);
    serverVersion = status.version;
    games = gamesRes.games || [];
    lastOk = true;
    setConn('ok');
  } catch (e) {
    lastOk = false;
    setConn('bad');
  }

  render();
  updateSummary();
  refreshing = false;
  if (manual) rbtn.classList.remove('spin');
}

function updateSummary() {
  const ready = games.filter(g => g.status === 'ready').length;
  document.getElementById('readyCount').textContent = lastOk ? ready : '—';
  document.getElementById('totalCount').textContent = lastOk ? games.length : '—';
  document.getElementById('lastCheck').textContent = lastOk
    ? `Actualizado ${new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit', second: '2-digit' })}`
    : 'Sin conexión con el servidor';
  document.getElementById('hostLabel').textContent = `${SERVER.host}:${SERVER.port}`;
  document.getElementById('footer').textContent =
    `gg_server ${serverVersion ? 'v' + serverVersion : '—'} · html v${HTML_VERSION}`;
}

function statusMeta(g) {
  switch (g.status) {
    case 'ready':      return { icon: '✅', label: 'Listo' };
    case 'compressed':  return { icon: '📦', label: 'Comprimido' };
    case 'running':     return { icon: '⏳', label: `${g.percent}%` };
    case 'error':        return { icon: '⚠️', label: 'Error' };
    default:             return { icon: '❔', label: g.status };
  }
}

function render() {
  const list = document.getElementById('list');
  const q = (document.getElementById('q').value || '').trim().toLowerCase();

  if (!lastOk && games.length === 0) {
    list.innerHTML = `
      <div class="offline">
        <b>No se pudo conectar con gg_server</b>
        No hay respuesta de ${SERVER.host}:${SERVER.port}. Chequeá que el servidor
        este corriendo en la PC y que el celular este en la misma red Tailscale.
        <div class="hint">Si abriste esta pagina por HTTPS (ej. GitHub Pages), el
        navegador puede estar bloqueando el pedido HTTP por "contenido mixto".</div>
      </div>`;
    return;
  }

  let filtered = games;
  if (q) filtered = games.filter(g => g.name.toLowerCase().includes(q));

  if (filtered.length === 0) {
    list.innerHTML = `<div class="empty">${q ? 'Sin resultados para tu busqueda.' : 'No hay juegos en la carpeta todavia.'}</div>`;
    return;
  }

  list.innerHTML = '';
  filtered.forEach(g => {
    const meta = statusMeta(g);
    const card = document.createElement('div');
    card.className = `card ${g.status}`;
    if (g.status === 'compressed') {
      card.onclick = () => extract(g.name);
    }

    const sizeTxt = g.archive_size ? fmtSize(g.archive_size) : '';
    const extractedTxt = g.extracted_at
      ? `Extraído ${new Date(g.extracted_at).toLocaleString('es-AR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })}`
      : '';
    const metaLine = g.status === 'running'
      ? `<span class="msg">${g.message || 'Descomprimiendo...'}</span>`
      : g.status === 'error'
        ? `<span class="msg">${g.message || 'Fallo la extraccion'}</span>`
        : g.status === 'ready'
          ? extractedTxt
          : sizeTxt;

    card.innerHTML = `
      <div class="g-ico ${g.status}">${meta.icon}</div>
      <div class="g-info">
        <div class="g-name">${g.name}</div>
        <div class="g-meta">${metaLine || '&nbsp;'}</div>
        ${g.status === 'running' ? `<div class="bar"><i style="width:${g.percent}%"></i></div>` : ''}
      </div>
      <div class="badge ${g.status}">${meta.label}</div>
    `;
    list.appendChild(card);
  });
}

async function extract(name) {
  const g = games.find(x => x.name === name);
  if (!g || g.status !== 'compressed') return;

  g.status = 'running';
  g.percent = 0;
  g.message = 'Iniciando...';
  render();

  try {
    const res = await apiGet(`/api/extract/${encodeURIComponent(name)}`);
    if (res.ok === false) {
      showToast(res.error || 'No se pudo iniciar la extraccion', true);
      await refresh(false);
      return;
    }
    showToast(`Descomprimiendo "${name}"...`);
  } catch (e) {
    showToast('No se pudo contactar al servidor', true);
    await refresh(false);
  }
}

async function pollRunning() {
  const running = games.filter(g => g.status === 'running');
  if (running.length === 0) return;

  let anyFinished = false;
  await Promise.all(running.map(async g => {
    try {
      const p = await apiGet(`/api/progress/${encodeURIComponent(g.name)}`);
      if (p.status === 'running') {
        g.percent = p.percent;
        g.message = p.message;
      } else if (p.status === 'done') {
        anyFinished = true;
      } else if (p.status === 'error') {
        g.status = 'error';
        g.message = p.message;
        showToast(`Error descomprimiendo "${g.name}"`, true);
      }
    } catch (e) { /* se resuelve en el proximo refresh completo */ }
  }));

  render();
  if (anyFinished) {
    showToast('Extraccion completada');
    await refresh(false);
  }
}

refresh(true);
setInterval(() => refresh(false), AUTO_REFRESH_MS);
setInterval(pollRunning, PROGRESS_POLL_MS);
</script>
</body>
</html>
